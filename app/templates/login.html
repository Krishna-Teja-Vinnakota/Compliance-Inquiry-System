 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Compliance Login</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
 </head>
 <body>
     <div class="container">
         <div class="image-container">
             {% if company_name == 'ford' %}
                 <img src="{{ url_for('static', filename='login-logo.png') }}" alt="Ford Logo">
             {% elif company_name == 'dollar_general' %}
                 <img src="{{ url_for('static', filename='login-logo.png') }}" alt="Company Logo">
             {% else %}
                 <img src="{{ url_for('static', filename='login-logo.png') }}" alt="Default Logo">
             {% endif %}
         </div>
         <div class="login-container">
             <div class="logo">
                 <h1>Compliance Assistant</h1>
                 <p>Instant answers, insights, and creativity!</p>
             </div>
             <form method="POST" action="/">
                 <div class="input-group">
                     <label for="email">Email Address</label>
                     <input type="email" id="email" name="email" placeholder="Enter email address" required>
                 </div>
                 <div class="input-group">
                     <label for="password">Password</label>
                     <input type="password" id="password" name="password" placeholder="Enter password" required>
                 </div>
                 <button type="submit" class="login-btn">Continue</button>
                 
                 {% if error %}
                     <div class="error-message">{{ error }}</div>
                 {% endif %}
                 
                 <div class="form-options">
                     <a href="forgot-password" class="forgot-password">Forgot password?</a>
                 </div>
                 <div class="signup-link">
                     <p>Don't have an account? <a href="signup">Sign Up</a></p>
                 </div>
             </form>
         </div>
     </div>
 </body>
 </html>
