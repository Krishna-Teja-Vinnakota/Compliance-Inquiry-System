runtime: python311
instance_class: F2

env_variables:
  FLASK_APP: "main.py"
  FLASK_ENV: "production"
  SECRET_KEY: "12345"
  GOOGLE_CLOUD_PROJECT: ""
  REGION: "us-central1"
  SESSION_TYPE: "filesystem"
  GOOGLE_APPLICATION_CREDENTIALS: ""
  QDRANT_URL: ""
  QDRANT_API_KEY: ""

handlers:
- url: /static
  static_dir: app/static
  secure: always
  
- url: /templates
  static_dir: app/templates
  secure: always

- url: /.*
  script: auto
  secure: always

entrypoint: gunicorn -b :$PORT main:app

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 25

vpc_access_connector:
  name: ""

service_account: ""
